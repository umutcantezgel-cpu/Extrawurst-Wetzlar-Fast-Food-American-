<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>404 - Seite nicht gefunden | Extrawurst Wetzlar</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;line-height:1.5;color:#212529;background:#f8f9fa;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}.container{max-width:600px;text-align:center;padding:2rem;background:#fff;border-radius:1rem;box-shadow:0 4px 6px rgba(0,0,0,.1)}h1{font-size:6rem;font-weight:800;color:#ff6b6b;margin-bottom:1rem}h2{font-size:1.5rem;font-weight:700;margin-bottom:1rem}p{color:#495057;margin-bottom:2rem}.btn{display:inline-block;padding:.75rem 1.5rem;background:#ff6b6b;color:#fff;text-decoration:none;border-radius:.5rem;font-weight:600;transition:all .2s}. btn:hover{background:#f03e3e;transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,107,107,.4)}
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Seite nicht gefunden</h2>
    <p>Die angeforderte Seite existiert leider nicht. Möglicherweise wurde sie verschoben oder gelöscht.</p>
    <a href="/" class="btn">Zur Startseite</a>
  </div>
</body>
</html>
